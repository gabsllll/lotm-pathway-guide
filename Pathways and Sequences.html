<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lord of the Mysteries: Spoiler-Free Pathways</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #0d0f15;
      --surface: #171b24;
      --surface-light: #202633;
      --surface-hover: #293141;
      --border: #353e50;

      --text: #edf1f7;
      --muted: #9fa9ba;
      --gold: #d8b15d;

      --confirmed: #58c68d;
      --assumed: #e4a84e;

      --sidebar-width: 290px;
      --history-width: 310px;

      /* Einheitliche Header-Höhe */
      --header-height: 77px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top,
          rgba(76, 63, 112, 0.38),
          transparent 38%),
        var(--background);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /*
   * Verhindert Scrollen des Main-Bereichs,
   * solange das mobile Menü geöffnet ist.
   */
    body.menu-open {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      min-height: 100vh;
    }

    /*
   * Header
   */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;

      min-height: var(--header-height);
      padding: 0.9rem 1.25rem;

      background: rgba(13, 15, 21, 0.93);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 46px;
      height: 46px;

      color: var(--background);
      background:
        linear-gradient(145deg,
          #eed38c,
          var(--gold));
      border-radius: 50%;
      box-shadow:
        0 0 0 4px rgba(216, 177, 93, 0.1),
        0 7px 25px rgba(216, 177, 93, 0.2);

      font-family: Georgia, serif;
      font-size: 1rem;
      font-weight: 800;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-copy h1 {
      overflow: hidden;
      margin: 0.1rem 0 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-progress {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .header-progress label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .chapter-input {
      width: 100px;
      padding: 0.65rem 0.75rem;
      color: var(--text);
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 800;
      text-align: center;
    }

    .chapter-input:focus {
      border-color: var(--gold);
      outline: 2px solid rgba(216, 177, 93, 0.2);
    }

    .mobile-menu-button {
      display: none;
      padding: 0.55rem 0.7rem;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
    }

    /*
   * Layout
   */

    .workspace {
      display: grid;
      grid-template-columns:
        var(--sidebar-width) minmax(0, 1fr) var(--history-width);

      min-height: calc(100vh - var(--header-height));
    }

    /*
   * Sidebar
   */

    .sidebar {
      position: sticky;
      top: var(--header-height);
      align-self: start;

      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      padding: 1rem;

      background: rgba(18, 21, 29, 0.92);
      border-right: 1px solid var(--border);
    }

    .sidebar-section+.sidebar-section {
      margin-top: 1.25rem;
    }

    .section-label {
      display: block;
      margin-bottom: 0.55rem;
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .search-input,
    .filter-select {
      width: 100%;
      padding: 0.7rem 0.8rem;
      color: var(--text);
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--gold);
      outline: 2px solid rgba(216, 177, 93, 0.18);
    }

    .search-help {
      display: block;
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .statistics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .stat {
      padding: 0.7rem;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 850;
    }

    .stat-title {
      display: block;
      margin-top: 0.12rem;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .pathway-list {
      display: grid;
      gap: 0.35rem;
    }

    .pathway-button {
      width: 100%;
      padding: 0.75rem;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition:
        background 140ms ease,
        border-color 140ms ease,
        transform 140ms ease;
    }

    .pathway-button:hover {
      background: var(--surface-light);
      border-color: var(--border);
      transform: translateX(2px);
    }

    .pathway-button.active {
      background:
        linear-gradient(100deg,
          rgba(216, 177, 93, 0.2),
          rgba(216, 177, 93, 0.04));
      border-color: rgba(216, 177, 93, 0.42);
    }

    .pathway-button-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .pathway-name {
      min-width: 0;
      overflow: hidden;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pathway-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .completion-bar {
      display: block;
      height: 4px;
      margin-top: 0.55rem;
      overflow: hidden;
      background: #313847;
      border-radius: 999px;
    }

    .completion-bar span {
      display: block;
      height: 100%;
      background:
        linear-gradient(90deg,
          var(--gold),
          #efd790);
      border-radius: inherit;
    }

    .no-pathways {
      padding: 1rem 0.6rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    /*
   * Main content
   */

    .main-content {
      min-width: 0;
      padding: 1.5rem;
    }

    .pathway-card {
      overflow: hidden;
      background: rgba(23, 27, 36, 0.96);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.22);
    }

    .pathway-card-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.35rem;

      background:
        radial-gradient(circle at top right,
          rgba(216, 177, 93, 0.22),
          transparent 42%);
      border-bottom: 1px solid var(--border);
    }

    .pathway-title-group h2 {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
    }

    .pathway-subtitle {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .favorite-button {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.6rem 0.75rem;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .favorite-button:hover {
      border-color: rgba(216, 177, 93, 0.45);
    }

    .favorite-button.active {
      color: var(--gold);
      border-color: rgba(216, 177, 93, 0.45);
    }

    .pathway-overview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 1rem 1.35rem;
      border-bottom: 1px solid var(--border);
    }

    .overview-stat {
      min-width: 0;
      padding: 0.85rem;
      text-align: center;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .overview-stat strong {
      display: block;
      overflow: hidden;
      color: var(--gold);
      font-size: 1.25rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-stat span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    /*
   * Sequence ladder
   */

    .sequence-ladder {
      display: grid;
      gap: 0.55rem;
      padding: 1.35rem;
    }

    .sequence-row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.8rem;

      min-height: 65px;
      padding: 0.7rem 0.85rem;

      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 11px;
      transition:
        border-color 140ms ease,
        background 140ms ease;
    }

    .sequence-row:hover {
      background: var(--surface-hover);
      border-color: #4a556b;
    }

    .sequence-row.search-match {
      border-color: rgba(216, 177, 93, 0.55);
      box-shadow: inset 3px 0 0 var(--gold);
    }

    .sequence-value {
      display: grid;
      place-items: center;

      width: 44px;
      height: 36px;

      color: var(--gold);
      background: rgba(216, 177, 93, 0.1);
      border: 1px solid rgba(216, 177, 93, 0.28);
      border-radius: 8px;

      font-weight: 900;
    }

    .sequence-copy {
      min-width: 0;
    }

    .sequence-copy strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sequence-copy small {
      display: block;
      margin-top: 0.18rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .sequence-note {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-confirmed {
      color: var(--confirmed);
      background: rgba(88, 198, 141, 0.11);
      border: 1px solid rgba(88, 198, 141, 0.32);
    }

    .badge-assumed {
      color: var(--assumed);
      background: rgba(228, 168, 78, 0.11);
      border: 1px solid rgba(228, 168, 78, 0.32);
    }

    .badge::before {
      width: 0.45rem;
      height: 0.45rem;
      background: currentColor;
      border-radius: 50%;
      content: "";
    }

    /*
   * Reveal history
   */

    .history-panel {
      position: sticky;
      top: var(--header-height);
      align-self: start;

      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      padding: 1rem;

      background: rgba(18, 21, 29, 0.78);
      border-left: 1px solid var(--border);
    }

    .history-panel h2 {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
    }

    .history-intro {
      margin: 0.4rem 0 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .history-list {
      position: relative;
      display: grid;
      gap: 0;
    }

    .history-list::before {
      position: absolute;
      top: 0.55rem;
      bottom: 0.55rem;
      left: 5px;
      width: 1px;
      background: var(--border);
      content: "";
    }

    .history-entry {
      position: relative;
      padding: 0 0 1rem 1.5rem;
    }

    .history-entry::before {
      position: absolute;
      top: 0.35rem;
      left: 0;

      width: 11px;
      height: 11px;

      background: var(--gold);
      border: 3px solid var(--surface);
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--gold);
      content: "";
    }

    .history-entry.assumed::before {
      background: var(--assumed);
      box-shadow: 0 0 0 1px var(--assumed);
    }

    .history-chapter {
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .history-entry strong {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.92rem;
    }

    .history-entry span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .empty-state {
      padding: 2.5rem 1rem;
      color: var(--muted);
      text-align: center;
    }

    /*
   * Mobile overlay
   */

    .mobile-overlay {
      position: fixed;
      inset: var(--header-height) 0 0;
      z-index: 25;

      display: none;

      background: rgba(0, 0, 0, 0.58);
    }

    .mobile-overlay.visible {
      display: block;
    }

    /*
   * Responsive layout
   */

    @media (max-width: 1050px) {
      .workspace {
        grid-template-columns:
          var(--sidebar-width) minmax(0, 1fr);
      }

      .history-panel {
        position: static;
        grid-column: 2;
        width: auto;
        height: auto;
        border-top: 1px solid var(--border);
        border-left: 0;
      }
    }

    /*
   * Mobile
   */

    @media (max-width: 760px) {
      :root {
        --header-height: 69px;
      }

      .topbar {
        min-height: var(--header-height);
        padding: 0.7rem 0.8rem;
      }

      .brand-icon {
        width: 39px;
        height: 39px;
        font-size: 0.8rem;
      }

      .brand-copy span {
        display: none;
      }

      .brand-copy h1 {
        font-size: 1.05rem;
      }

      .header-progress label {
        display: none;
      }

      .chapter-input {
        width: 78px;
      }

      .mobile-menu-button {
        display: inline-flex;
      }

      .workspace {
        display: block;
        min-height: auto;
      }

      /*
     * Mobile Sidebar
     *
     * Eigener Scrollbereich.
     * 100dvh berücksichtigt die tatsächlich sichtbare
     * Viewport-Höhe auf modernen mobilen Browsern besser.
     */
      .sidebar {
        position: fixed;
        top: var(--header-height);
        bottom: 0;
        left: 0;
        z-index: 30;

        width: min(88vw, 320px);
        height: calc(100dvh - var(--header-height));

        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;

        box-shadow: 18px 0 45px rgba(0, 0, 0, 0.45);

        transform: translateX(-105%);
        transition: transform 180ms ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        padding: 0.8rem;
      }

      .pathway-card-header {
        align-items: stretch;
        flex-direction: column;
      }

      .favorite-button {
        align-self: flex-start;
      }

      /*
     * Reveal History auf Smartphones vollständig ausblenden.
     * Die Definition aus dem 1050px-Breakpoint wird dadurch
     * überschrieben.
     */
      .history-panel {
        display: none;
      }

      .pathway-overview {
        grid-template-columns: 1fr;
      }

      .sequence-row {
        grid-template-columns: 55px minmax(0, 1fr);
      }

      .sequence-row .badge {
        grid-column: 2;
        justify-self: start;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open pathway navigation"
          aria-controls="sidebar" aria-expanded="false">
          ☰
        </button>

        <div class="brand-icon">XXII</div> <!-- Ⅸ-->

        <div class="brand-copy">
          <span>Lord of the Mysteries</span>
          <h1>Pathways &amp; Sequences</h1>
        </div>
      </div>

      <div class="header-progress">
        <label for="chapterInput">Current chapter</label>

        <input class="chapter-input" id="chapterInput" type="number" min="1" max="1432" value="1" inputmode="numeric">
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <section class="sidebar-section">
          <label class="section-label" for="searchInput">
            Search
          </label>

          <input class="search-input" id="searchInput" type="search" placeholder="Pathway, name or notes..."
            autocomplete="off">

          <small class="search-help">
            Searches all visible Pathway names, Sequence names,
            and notes.
          </small>
        </section>

        <section class="sidebar-section">
          <label class="section-label" for="statusFilter">
            Status
          </label>

          <select class="filter-select" id="statusFilter">
            <option value="all">
              Confirmed and assumed
            </option>

            <option value="confirmed">
              Confirmed only
            </option>

            <option value="assumed">
              Assumed only
            </option>
          </select>
        </section>

        <section class="sidebar-section">
          <span class="section-label">Progress</span>

          <div class="statistics">
            <div class="stat">
              <strong class="stat-value" id="knownCount">0</strong>
              <span class="stat-title">Visible names</span>
            </div>

            <div class="stat">
              <strong class="stat-value" id="pathwayCount">0</strong>
              <span class="stat-title">Pathways</span>
            </div>

            <div class="stat">
              <strong class="stat-value" id="confirmedCount">0</strong>
              <span class="stat-title">Confirmed</span>
            </div>

            <div class="stat">
              <strong class="stat-value" id="assumedCount">0</strong>
              <span class="stat-title">Assumed</span>
            </div>
          </div>
        </section>

        <section class="sidebar-section">
          <span class="section-label">Pathways</span>
          <nav class="pathway-list" id="pathwayList"></nav>
        </section>
      </aside>

      <main class="main-content" id="mainContent"></main>

      <aside class="history-panel">
        <h2>Reveal History</h2>

        <p class="history-intro">
          The latest discoveries visible at your current reading
          progress.
        </p>

        <div class="history-list" id="historyList"></div>
      </aside>
    </div>

    <div class="mobile-overlay" id="mobileOverlay" aria-hidden="true"></div>
  </div>

  <script>
    /*
     * DATA FORMAT
     *
     * 0: Pathway
     * 1: Sequence number
     * 2: Sequence name
     * 3: First visible chapter
     * 4: Whether the chapter is exact
     * 5: Initial status
     * 6: Initial note
     * 7: Optional revelation history
     */

    const rawSequenceData = [
      /*
       * Neighbouring Pathways:
       * Seer, Marauder, Apprentice
       * Storm, Sun, Spectator, Reader, Secrets Suppliant
       * Mystery Prier, Savant
       * Arbiter, Lawyer
       * Prisoner, Criminal
       * Hunter, Assassin
       * Planter, Apothecary
       * Monster doens't have any
       */
      /*
       * Seer
       */
      [
        "seer", 9, "Seer", 28, true, "confirmed",
        "Explicitly identified as Sequence 9."
      ],
      [
        "seer", 8, "Clown", 75, true, "confirmed",
        "Confirmed as the Sequence following Seer."
      ],
      [
        "seer", 7, "Magician", 251, true, "confirmed",
        "Obtained through spirit channeling involving Rosago."
      ],
      [
        "seer", 6, "Faceless", 251, true, "confirmed",
        "Obtained through spirit channeling involving Rosago."
      ],
      [
        "seer", 5, "Nimblewright Master", 251, true, "confirmed",
        "Obtained through spirit channeling involving Rosago. " +
        "Also known as Marionettist."
      ],
      [
        "seer", 4, "Bizarro Sorcerer", 675, true, "confirmed",
        "Confirmed by Will Auceptin. Also known as Arcane Sorcerer."
      ],
      [
        "seer", 3, "Scholar of Yore", 839, true, "confirmed",
        "Named by Zaratul in Foggy Town."
      ],
      [
        "seer", 2, "Miracle Invoker", 237, true, "confirmed",
        "Explicitly identified as Sequence 2 in Roselle's diary."
      ],
      [
        "seer", 1, "Attendant of Mysteries", 713, true, "confirmed",
        "Explicitly identified as Sequence 1 by Arrodes."
      ],
      [
        "seer", 0, "Fool", 842, true, "confirmed",
        "Revealed through the corresponding Card of Blasphemy."
      ],

      /*
       * Marauder
       */
      [
        "marauder", 9, "Marauder", 65, true, "confirmed",
        "Known from the Nighthawks' internal documents."
      ],
      [
        "marauder", 8, "Swindler", 65, true, "confirmed",
        "Known from the Nighthawks' internal documents."
      ],
      [
        "marauder", 7, "Cryptologist", 697, true, "confirmed",
        "Mobet identifies Cryptologist as Sequence 7."
      ],
      [
        "marauder", 6, "Fire Bandit", 697, true, "confirmed",
        "Mobet identifies Fire Bandit as Sequence 6."
      ],
      [
        "marauder", 5, "Dream Stealer", 697, true, "confirmed",
        "Mobet identifies himself as a Sequence 5 Dream Stealer " +
        "of the Marauder Pathway."

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeSearchText(value) {
      return String(value || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLocaleLowerCase("en")
        .trim();
    }

    function getSearchTerms() {
      return normalizeSearchText(searchInput.value)
        .split(/\s+/)
        .filter(Boolean);
    }

    /*
     * Search includes:
     *
     * 1. Pathway
     * 2. Sequence name
     * 3. Current note
     *
     * All entered words must occur somewhere in the combined
     * searchable text.
     */
    function entryMatchesSearch(entry, searchTerms) {
      if (searchTerms.length === 0) {
        return true;
      }

      const currentPathwayName =
        getPathwayDisplayName(entry.pathway);

      const searchableText = normalizeSearchText([
        currentPathwayName,
        entry.name,
        entry.note
      ].join(" "));

      return searchTerms.every(term => {
        return searchableText.includes(term);
      });
    }

    function getCurrentChapter() {
      const parsedChapter = Number.parseInt(
        chapterInput.value,
        10
      );

      if (!Number.isFinite(parsedChapter)) {
        return 1;
      }

      return Math.max(
        1,
        Math.min(1432, parsedChapter)
      );
    }
    function getPathwayDisplayName(
      pathwayId,
      currentChapter = getCurrentChapter()
    ) {
      const configuredNames =
        pathwayNameData[pathwayId] || [];

      const availableNames = configuredNames
        .filter(nameEntry => {
          return nameEntry.chapter <= currentChapter;
        })
        .sort((a, b) => {
          return a.chapter - b.chapter;
        });

      if (availableNames.length > 0) {
        return availableNames[
          availableNames.length - 1
        ].name;
      }

      /*
       * Fallback:
       * Wenn keine eigene Pathway-Konfiguration existiert,
       * wird der Name von Sequence 9 verwendet.
       */
      const sequenceNine = sequenceData.find(entry => {
        return entry.pathway === pathwayId &&
          entry.sequence === 9 &&
          entry.chapter <= currentChapter;
      });

      if (sequenceNine) {
        return sequenceNine.name;
      }

      /*
       * Letzter Fallback ist die interne ID.
       */
      return pathwayId;
    }

    function getCurrentRevelation(entry, currentChapter) {
      const availableRevelations = entry.revelations
        .filter(revelation => {
          return revelation.chapter <= currentChapter;
        })
        .sort((a, b) => {
          return a.chapter - b.chapter;
        });

      if (availableRevelations.length === 0) {
        return null;
      }

      return availableRevelations[
        availableRevelations.length - 1
      ];
    }

    function resolveEntryForChapter(entry, currentChapter) {
      const currentRevelation = getCurrentRevelation(
        entry,
        currentChapter
      );

      if (!currentRevelation) {
        return null;
      }

      return {
        ...entry,
        chapter: currentRevelation.chapter,
        exactChapter: currentRevelation.exactChapter,
        status: currentRevelation.status,
        note: currentRevelation.note
      };
    }

    /*
     * Resolves entries according to chapter and status before
     * applying the global Pathway, name and notes search.
     */
    function getVisibleEntries() {
      const currentChapter = getCurrentChapter();
      const selectedStatus = statusFilter.value;
      const searchTerms = getSearchTerms();

      return sequenceData
        .map(entry => {
          return resolveEntryForChapter(
            entry,
            currentChapter
          );
        })
        .filter(entry => entry !== null)
        .filter(entry => {
          if (selectedStatus === "all") {
            return true;
          }

          return entry.status === selectedStatus;
        })
        .filter(entry => {
          return entryMatchesSearch(
            entry,
            searchTerms
          );
        });
    }

    function groupByPathway(entries) {
      return entries.reduce((groups, entry) => {
        if (!groups[entry.pathway]) {
          groups[entry.pathway] = [];
        }

        groups[entry.pathway].push(entry);

        return groups;
      }, {});
    }

      sidebar.classList.remove("open");

    function renderStatistics(entries, groups) {
      knownCount.textContent = entries.length;

      pathwayCount.textContent =
        Object.keys(groups).length;

      confirmedCount.textContent = entries.filter(entry => {
        return entry.status === "confirmed";
      }).length;

      assumedCount.textContent = entries.filter(entry => {
        return entry.status === "assumed";
      }).length;
    }

    function sortPathways(pathways) {
      return pathways.sort((a, b) => {
        const aFavorite = favorites.has(a);
        const bFavorite = favorites.has(b);

        if (aFavorite !== bFavorite) {
          return aFavorite ? -1 : 1;
        }

        const aDisplayName =
          getPathwayDisplayName(a);

        const bDisplayName =
          getPathwayDisplayName(b);

        return aDisplayName.localeCompare(
          bDisplayName,
          "de"
        );
      });
    }

    const sequenceCountKnowledge = {
      chapter: 265,
      total: 10
    };

    function isTotalSequenceCountKnown() {
      return getCurrentChapter() >= sequenceCountKnowledge.chapter;
    }

    function getSequenceCountLabel(visibleCount) {
      if (isTotalSequenceCountKnown()) {
        return `${visibleCount}/${sequenceCountKnowledge.total}`;
      }

      return `${visibleCount} known`;
    }

    function renderPathwayNavigation(groups) {
      const pathways = sortPathways(
        Object.keys(groups)
      );

      if (pathways.length === 0) {
        pathwayList.innerHTML = `
          <div class="no-pathways">
            No entries match the current chapter,
            status and search filters.
          </div>
        `;

        return;
      }

      if (!pathways.includes(selectedPathway)) {
        selectedPathway = pathways[0];
      }

      localStorage.setItem(
        "lotm-selected-pathway",
        selectedPathway
      );

      pathwayList.innerHTML = pathways
        .map(pathway => {
          const entries = groups[pathway];
          const displayName =
            getPathwayDisplayName(pathway);

          const totalCountKnown = isTotalSequenceCountKnown();

          const percentage = totalCountKnown
            ? Math.min(
              100,
              Math.round(
                (entries.length / sequenceCountKnowledge.total) * 100
              )
            )
            : 0;

          const favoritePrefix =
            favorites.has(pathway) ? "★ " : "";

          return `
            <button
              class="pathway-button ${pathway === selectedPathway
              ? "active"
              : ""
            }"
              type="button"
              data-pathway="${escapeHtml(pathway)}"
            >
              <span class="pathway-button-top">
                <span class="pathway-name">
                  ${favoritePrefix}${escapeHtml(displayName)}
                </span>

                <span class="pathway-count">
                  ${getSequenceCountLabel(entries.length)}
                </span>
              </span>

              ${totalCountKnown ? `
              <span class="completion-bar">
                <span style="width: ${percentage}%"></span>
              </span>
              ` : ""}
            </button>
          `;
        })
        .join("");

      pathwayList
        .querySelectorAll(".pathway-button")
        .forEach(button => {
          button.addEventListener("click", () => {
            selectedPathway = button.dataset.pathway;

            localStorage.setItem(
              "lotm-selected-pathway",
              selectedPathway
            );

            closeMobileSidebar();
            render();
          });
        });
    }

    function getChapterLabel(entry) {
      if (entry.exactChapter) {
        return `Chapter ${entry.chapter}`;
      }

      return `Known by Chapter ${entry.chapter}`;
    }

    function renderMainPanel(groups) {
      const entries = groups[selectedPathway] || [];
      const pathwayDisplayName =
        getPathwayDisplayName(selectedPathway);

      if (entries.length === 0) {
        mainContent.innerHTML = `
          <div class="pathway-card">
            <div class="empty-state">
              No Sequence entries match the current filters.
            </div>
          </div>
        `;

        return;
      }

      /*
       * Sequence 0 is rendered first, then 1 through 9.
       */
      const sortedEntries = entries
        .slice()
        .sort((a, b) => {
          return a.sequence - b.sequence;
        });

      const highestKnown = sortedEntries[0];

      const confirmedEntries = entries.filter(entry => {
        return entry.status === "confirmed";
      }).length;

      const assumedEntries = entries.filter(entry => {
        return entry.status === "assumed";
      }).length;

      const isFavorite = favorites.has(selectedPathway);
      const hasSearch = getSearchTerms().length > 0;

      mainContent.innerHTML = `
        <article class="pathway-card">
          <header class="pathway-card-header">
            <div class="pathway-title-group">
              <h2>
                ${escapeHtml(pathwayDisplayName)} Pathway
              </h2>

              <p class="pathway-subtitle">
                Visible information at Chapter
                ${getCurrentChapter()}
                ${hasSearch
          ? " · Search results only"
          : ""
        }
              </p>
            </div>

            <button
              class="favorite-button ${isFavorite ? "active" : ""
        }"
              id="favoriteButton"
              type="button"
            >
              ${isFavorite
          ? "★ Favorite"
          : "☆ Add favorite"
        }
            </button>
          </header>

          <section class="pathway-overview">
            <div class="overview-stat">
              <strong>${getSequenceCountLabel(entries.length)}</strong>
              <span>
                ${isTotalSequenceCountKnown() ? "Visible Sequences" : "Known Sequences"}
              </span>
            </div>

            <div class="overview-stat">
              <strong>
                ${escapeHtml(highestKnown.name)}
              </strong>
              <span>Highest known stage</span>
            </div>

            <div class="overview-stat">
              <strong>
                ${confirmedEntries} / ${assumedEntries}
              </strong>
              <span>Confirmed / assumed</span>
            </div>
          </section>

          <section class="sequence-ladder">
            ${sortedEntries.map(entry => `
              <article
                class="sequence-row ${hasSearch ? "search-match" : ""
          }"
              >
                <div class="sequence-value">
                  ${entry.sequence}
                </div>

                <div class="sequence-copy">
                  <strong>
                    ${escapeHtml(entry.name)}
                  </strong>

                  <small>
                    ${escapeHtml(getChapterLabel(entry))}
                  </small>

                  <span class="sequence-note">
                    ${escapeHtml(entry.note)}
                  </span>
                </div>

                <span class="badge badge-${entry.status}">
                  ${entry.status === "confirmed"
            ? "Confirmed"
            : "Assumed"
          }
                </span>
              </article>
            `).join("")}
          </section>
        </article>
      `;

      document
        .getElementById("favoriteButton")
        .addEventListener("click", () => {
          if (favorites.has(selectedPathway)) {
            favorites.delete(selectedPathway);
          } else {
            favorites.add(selectedPathway);
          }

          saveFavorites();
          render();
        });
    }

    function renderHistory(entries) {
      const history = entries
        .slice()
        .sort((a, b) => {
          if (b.chapter !== a.chapter) {
            return b.chapter - a.chapter;
          }

          return a.sequence - b.sequence;
        })
        .slice(0, 11);

      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="empty-state">
            No discoveries match the current filters.
          </div>
        `;

        return;
      }

      historyList.innerHTML = history
        .map(entry => `
          <article class="history-entry ${entry.status}">
            <div class="history-chapter">
              ${escapeHtml(getChapterLabel(entry))}
            </div>

            <strong>
              ${escapeHtml(entry.name)}
            </strong>

            <span>
              Sequence ${entry.sequence},
              ${escapeHtml(
          getPathwayDisplayName(entry.pathway)
        )} Pathway
            </span>

            <span>
              ${entry.status === "confirmed"
            ? "Confirmed"
            : "Assumed"
          }
            </span>
          </article>
        `)
        .join("");
    }

    function render() {
      const currentChapter = getCurrentChapter();

      chapterInput.value = currentChapter;

      localStorage.setItem(
        "lotm-current-chapter",
        String(currentChapter)
      );

      const visibleEntries = getVisibleEntries();
      const groups = groupByPathway(visibleEntries);

      renderStatistics(visibleEntries, groups);
      renderPathwayNavigation(groups);
      renderMainPanel(groups);
      renderHistory(visibleEntries);
    }

    chapterInput.addEventListener("input", render);
    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    mobileMenuButton.addEventListener("click", () => {
      if (sidebar.classList.contains("open")) {
        closeMobileSidebar();
      } else {
        openMobileSidebar();
      }
    });


    mobileOverlay.addEventListener(
      "click",
      closeMobileSidebar
    );


    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        sidebar.classList.contains("open")
      ) {
        closeMobileSidebar();
      }
    });


    /*
     * Falls das Fenster bei geöffnetem Burger-Menü
     * wieder auf Desktop-Größe vergrößert wird,
     * wird der mobile Zustand vollständig entfernt.
     */
    window.addEventListener("resize", () => {
      if (
        window.innerWidth > 760 &&
        sidebar.classList.contains("open")
      ) {
        closeMobileSidebar();
      }
    });

    render();
  </script>
</body>

</html>
